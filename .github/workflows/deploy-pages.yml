name: Deploy to GitHub Pages

# 仅在工作流文件本身或源代码变化时触发，避免一次 push 触发多次部署。
on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发，便于排查部署问题。
  workflow_dispatch:

# 同一时间只允许一个部署任务，新的一次推送取消进行中的旧任务。
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 先生成内容模块：data/site/*.ts 由 sync-content 从 Markdown 生成，
      # 其中 .sync-stamp.ts 未纳入版本库，必须先同步再类型检查，
      # 否则全新 checkout 上会报「找不到模块 './.sync-stamp'」。
      - name: Sync content modules
        run: npm run sync-content

      # 决定「网站内容从哪来」：这一步会去问一次后端，问得到就用库里的数据，
      # 问不到就用 data/site/*.md 模版。**GitHub Actions 上没有后端**，
      # 因此 Pages 这条路必然是模版 —— 这正是我们要的（见 docs/技术架构.md §10.1）。
      # 放在类型检查之前：它生成的 data/site/.backend-snapshot.ts 未纳入版本库。
      - name: Decide site data source
        run: npm run sync-site-data
        env:
          # 显式写死：就算将来在这台机器上碰巧能连到什么，也只用模版构 Pages。
          SITE_CONTENT_SOURCE: template

      - name: Typecheck
        run: npm run typecheck

      # 内容与报价自检：栏目→卡片结构与课程页锚点的双向校验都在这里，
      # 结构改错时直接让部署失败，而不是把跳空的卡片发到线上。
      - name: Check content and pricing
        run: npm run check

      - name: Build static export
        # 项目站点部署在 https://<user>.github.io/<repo>/，必须注入仓库名作为子路径前缀。
        # 用 ${{ github.event.repository.name }} 而非写死仓库名，fork 后无需修改。
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Disable Jekyll processing
        # GitHub Pages 默认用 Jekyll 处理静态文件，会忽略以 _ 开头的目录
        # （Next 导出的 _next/ 正好命中），必须放置 .nojekyll 跳过该步骤。
        run: touch out/.nojekyll

      - name: Check 404 artifact
        # 校验 out/404.html 的自定义文案与站内链接前缀。
        # 前缀按 NEXT_PUBLIC_BASE_PATH 推断，这里必须与构建时一致。
        run: npm run check:404
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Check internal links
        # 站点是静态托管，链接写错没有服务端兜底，只会让访客点进 404：
        # 这里逐页取出站内链接，校验目标页面与锚点是否真的存在。
        run: npm run check:links
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # 不自动启用 Pages：若仓库尚未在 Settings 中把 Source 设为
        # "GitHub Actions"，这里会明确失败并给出提示，而不是静默改动仓库设置。
        with:
          enablement: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
